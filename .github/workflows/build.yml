name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: metis-mesh-hq-linux-x86_64
            binary: target/release/metis-mesh-hq
          - name: Windows
            os: windows-latest
            artifact: metis-mesh-hq-windows-x86_64
            binary: target/release/metis-mesh-hq.exe
          - name: macOS
            os: macos-15
            artifact: metis-mesh-hq-macos-aarch64
            binary: target/release/metis-mesh-hq

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev \
            libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Artifact basename
        id: art
        shell: bash
        run: |
          base="${{ matrix.artifact }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${base}-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: cargo test --release

      - name: Build release
        run: cargo build --release

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ steps.art.outputs.name }}"
          chmod +x "dist/${{ steps.art.outputs.name }}"
          (
            cd dist
            tar -czf "../${{ steps.art.outputs.name }}.tar.gz" "${{ steps.art.outputs.name }}"
          )
          ls -lh "${{ steps.art.outputs.name }}.tar.gz"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.binary }}" "dist/${{ steps.art.outputs.name }}.exe"
          Compress-Archive -Path "dist/${{ steps.art.outputs.name }}.exe" -DestinationPath "${{ steps.art.outputs.name }}.zip" -Force
          Get-Item "${{ steps.art.outputs.name }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            ${{ steps.art.outputs.name }}.tar.gz
            ${{ steps.art.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} upload/ \;
          ls -lh upload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
