[package]
name = "metis-mesh-hq"
version = "0.1.16"
edition = "2021"
description = "Offline emergency headquarters for MeshCore communities"
license = "MIT"
authors = ["DigitalExpl0it"]

[build-dependencies]
winres = "0.1"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
btleplug = "0.12"
chacha20poly1305 = "0.10"
chrono = "0.4"
dioxus = "0.7"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
keyring = "3"
# Bridge btleplug (`log`) and meshcore-rs (`tracing`) into the HQ app log / log file.
log = "0.4"
# Path pin: vendored 0.2.0 with Windows BLE fixes (write-with-response, notify
# ready before APPSTART, longer find, subscribe retry). Drop when upstream lands.
meshcore-rs = { path = "vendor/meshcore-rs", default-features = false, features = ["ble", "serial", "tcp"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = "0.13"
regex = "1"
rustls-pemfile = "2"
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
unicode-segmentation = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# ureq HTTPS needs the `tls` feature (rustls). `native-tls` alone does NOT wire
# ureq::get — it only unlocks AgentBuilder::tls_connector, and yields
# "cannot make HTTPS request because no TLS backend is configured".
# `native-certs` feeds the OS trust store into rustls so corporate MITM roots
# (Zscaler, etc.) already trusted by Windows/macOS/Linux are honored.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
uuid = "1"
webpki-roots = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
gtk = "0.18"
# Match wry's webkit2gtk so we can turn on WebContext spellcheck (HTML
# spellcheck alone is not enough on Linux WebKitGTK).
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
# WinRT custom pairing (PIN bond). Same major as btleplug 0.12 so only one copy links.
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
