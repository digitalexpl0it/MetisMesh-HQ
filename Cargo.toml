[package]
name = "metis-mesh-hq"
version = "0.1.6a"
edition = "2021"
description = "Offline emergency headquarters for MeshCore communities"
license = "MIT"
authors = ["DigitalExpl0it"]

[build-dependencies]
winres = "0.1"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
btleplug = "0.12"
chacha20poly1305 = "0.10"
chrono = "0.4"
dioxus = "0.7"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
keyring = "3"
meshcore-rs = { version = "0.2", default-features = false, features = ["ble", "serial", "tcp"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
regex = "1"
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# native-tls → Windows SChannel / macOS Security / OpenSSL so corporate MITM
# roots (Zscaler, etc.) already in the OS trust store are honored. rustls+webpki
# only knows Mozilla CAs and fails with "certificate unknown" behind those proxies.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
uuid = "1"
webpki-roots = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
