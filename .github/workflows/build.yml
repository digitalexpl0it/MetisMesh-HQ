name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
            artifact: metis-mesh-hq-linux-x86_64
            binary: target/release/metis-mesh-hq
          - name: Windows
            os: windows-latest
            artifact: metis-mesh-hq-windows-x86_64
            binary: target/release/metis-mesh-hq.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev \
            libudev-dev \
            file \
            desktop-file-utils \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Artifact basename
        id: art
        shell: bash
        run: |
          base="${{ matrix.artifact }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${base}-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            ver="${{ github.ref_name }}"
            ver="${ver#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${base}" >> "$GITHUB_OUTPUT"
            ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: cargo test --release

      - name: Build release
        run: cargo build --release

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/metis-mesh-hq"
          chmod +x "dist/metis-mesh-hq"
          cp -a assets "dist/assets"
          (
            cd dist
            tar -czf "../${{ steps.art.outputs.name }}.tar.gz" metis-mesh-hq assets
          )
          ls -lh "${{ steps.art.outputs.name }}.tar.gz"

      - name: Package Ubuntu 26.04 deb
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-deb.sh
          ver="${{ steps.art.outputs.version }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            out="metis-mesh-hq_${ver}_amd64.deb"
          else
            out="metis-mesh-hq_${ver}_amd64.deb"
          fi
          VERSION="$ver" OUT_NAME="$out" ./packaging/linux/build-deb.sh

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-appimage.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            out="metis-mesh-hq-x86_64-${{ github.ref_name }}.AppImage"
          else
            out="metis-mesh-hq-x86_64.AppImage"
          fi
          OUT_NAME="$out" ./packaging/linux/build-appimage.sh

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.binary }}" "dist/${{ steps.art.outputs.name }}.exe"
          Copy-Item -Recurse assets "dist/assets"
          Compress-Archive -Path @("dist/${{ steps.art.outputs.name }}.exe", "dist/assets") -DestinationPath "${{ steps.art.outputs.name }}.zip" -Force
          Get-Item "${{ steps.art.outputs.name }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            ${{ steps.art.outputs.name }}.tar.gz
            ${{ steps.art.outputs.name }}.zip
            metis-mesh-hq_*_amd64.deb
            metis-mesh-hq-x86_64*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find artifacts -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) -exec cp {} upload/ \;
          ls -lh upload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
